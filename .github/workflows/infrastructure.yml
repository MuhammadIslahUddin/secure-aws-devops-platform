name: Deploy Infrastructure
on:
  push:
    branches: [main]
    paths: ["terraform/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: cd terraform/environments/dev && terraform init

      - name: Terraform Validate
        run: cd terraform/environments/dev && terraform validate

      - name: Terraform Plan
        run: cd terraform/environments/dev && terraform plan -var-file=terraform.tfvars

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: cd terraform/environments/dev && terraform apply -auto-approve -var-file=terraform.tfvars
